name: Render acceptance videos

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [browser, ports, shopping, budget]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chinese fonts and FFprobe
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk ffmpeg
      - name: Create standalone source project
        run: node skills/knowledge-motion/scripts/create-project.mjs --knowledge skills/knowledge-motion/examples/${{ matrix.example }}/knowledge.json --story skills/knowledge-motion/examples/${{ matrix.example }}/story.json --project-root . --out out/video
      - name: Install locked dependencies
        working-directory: out/video
        run: npm ci
      - name: Generate keyframes and silent MP4
        working-directory: out/video
        run: |
          npm run preview
          npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-motion-${{ matrix.example }}
          path: |
            out/video/video.mp4
            out/video/verification.json
            out/video/knowledge.json
            out/video/knowledge.md
            out/video/story.json
            out/video/storyboard.md
            out/video/chapters.json
            out/video/previews/
