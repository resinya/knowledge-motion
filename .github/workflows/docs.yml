name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# 只允许一个 Pages 部署排队，避免并发覆盖
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      # Next.js 与静态资源共同启用 Pages 路径
      PAGES: '1'
    steps:
      - uses: actions/checkout@v4

      - name: 读取 Pages 发布地址
        id: pages
        uses: actions/configure-pages@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      # 这里没用 --frozen-lockfile：仓库里的 lockfile 是 v9 格式，
      # 而 CI 跑的是 pnpm 10，冻结模式可能因格式版本直接失败。
      - name: 安装依赖
        run: pnpm install

      - name: 构建静态站点
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: pnpm build

      - name: 检查发布路径与静态资源
        run: pnpm check:export --base-path="${{ steps.pages.outputs.base_path }}"

      # GitHub Pages 默认用 Jekyll 处理，会忽略下划线开头的目录，
      # 不放这个文件 _next/ 下的 JS/CSS 全部 404 —— 这是部署 Next.js 到 Pages 最经典的坑
      - name: 生成 .nojekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
